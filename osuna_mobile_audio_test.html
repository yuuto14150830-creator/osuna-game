<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<title>押すな。 MOBILE - PC版移植</title>
<style>
:root{color-scheme:dark;--bg:#0f0f12;--panel:#1b1b21;--muted:#919196;--red:#dc232d;--darkred:#8c1419;--green:#46be6e;--blue:#4696ff;--purple:#b964ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#08090e;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;min-height:100%;touch-action:manipulation}
#app{width:min(100%,760px);min-height:100vh;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));position:relative;overflow:hidden}
h1,h2,p{margin:0}.title{text-align:center;font-size:clamp(34px,10vw,64px);margin-top:42px}.sub{text-align:center;color:var(--muted);margin-top:18px;line-height:1.7}
.btn{border:0;border-radius:12px;background:#37373e;color:white;font-weight:700;font-size:16px;min-height:48px;padding:10px 16px;touch-action:manipulation}.btn:active{transform:scale(.97)}
.red{background:var(--red)}.green{background:var(--green)}.blue{background:var(--blue)}.purple{background:var(--purple)}.darkred{background:var(--darkred)}
.back{position:absolute;left:12px;top:max(14px,env(safe-area-inset-top));z-index:5}.bottom{display:flex;gap:12px;margin-top:32px}.bottom>*{flex:1}
.big-red{display:block;width:185px;height:185px;border-radius:50%;border:0;background:var(--red);box-shadow:0 12px 0 var(--darkred);margin:82px auto 0}.big-red:active{transform:translateY(6px);box-shadow:0 6px 0 var(--darkred)}
.counter{text-align:center;margin-top:32px;color:var(--muted)}.center{text-align:center}.panel{margin:105px auto 0;max-width:520px}.panel .btn{width:100%;margin:7px 0}
.scroll{height:calc(100vh - 80px);overflow-y:auto;padding:95px 6px 110px;-webkit-overflow-scrolling:touch}.custom-title{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none}
.custom-item{width:100%;margin:6px 0}.stat{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;margin:12px 0}.muted{color:var(--muted);font-size:14px}
.ending,.modal{padding-top:125px;text-align:center}.ending h2{font-size:34px}.ending .name{font-size:24px;margin:24px 0}.modal .btn{margin:8px;min-width:145px}
.collection{padding:80px 0 30px}.endrow{padding:12px;border-bottom:1px solid #333}
.gamewrap{padding-top:42px}.hud{display:flex;justify-content:space-between;gap:6px;font-weight:700;margin-bottom:7px;font-size:13px}.hpbar{height:10px;background:#333;border-radius:8px;overflow:hidden;margin-bottom:8px}.hpbar>i{display:block;height:100%;background:#dc232d}
.arena{width:100%;aspect-ratio:4/3;background:#070912;border:1px solid #282b3a;border-radius:10px;position:relative;overflow:hidden;touch-action:none}
.ship{position:absolute;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:36px solid #4696ff;transform:translate(-50%,-50%)}
.wing{position:absolute;width:15px;height:22px;background:#50dcd2;clip-path:polygon(50% 0,0 100%,50% 72%,100% 100%);transform:translate(-50%,-50%)}
.enemy{position:absolute;width:30px;height:30px;border-radius:50%;background:#dc232d;transform:translate(-50%,-50%)}
.boss{position:absolute;width:18%;height:10%;min-width:76px;min-height:42px;border-radius:14px;background:#b964ff;transform:translate(-50%,-50%)}
.bullet,.ebullet{position:absolute;width:6px;height:14px;border-radius:4px;background:#ffe050;transform:translate(-50%,-50%)}.ebullet{background:#ff5555;width:9px;height:16px}
.special{position:absolute;color:#ff4545;font-weight:900;font-size:28px;transform:translate(-50%,-50%);white-space:nowrap}
.controls{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:10px;align-items:center}.move-pad{display:flex;align-items:center;justify-content:center;min-height:116px}
.joystick{width:110px;height:110px;border-radius:50%;background:#242936;border:3px solid #4a5265;position:relative;touch-action:none;user-select:none}.joystick-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:#69748d;transform:translate(-50%,-50%);pointer-events:none}
.shoot{background:var(--red);font-size:21px!important;font-weight:900;border-radius:50%!important;width:106px;height:106px;min-height:106px!important;justify-self:center;user-select:none;touch-action:none}
.notice{text-align:center;color:#ffe050;min-height:22px;margin-top:8px}
</style>
</head><body><main id="app"></main>

function tone(freq=440,dur=.08,type='square',vol=.08,slide=0){try{let c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur)}catch(e){}}

function stopBgm(){if(bgm){bgm.pause();bgm.currentTime=0;bgm=null}}
function bossBgm(rush){stopBgm();if(rush){SE.alarm();return}bgm=new Audio(KINETIC);bgm.loop=true;bgm.volume=.34;bgm.play().catch(()=>{})}

let scene="main",started=Date.now(),outside=0,currentEnd="",newEnd=false,rapidCount=0,rapidNotice="",raf=0,G=null,lastBossNo=1,bossRush=false;
let keys={left:false,right:false,shoot:false};
const ec=()=>S.ends.length;
function unlock(id){currentEnd=id;newEnd=!S.ends.includes(id);if(newEnd){S.ends.push(id);save()}return newEnd}
const dual=()=>ec()>=3,spread=()=>ec()>=6,shield=()=>ec()>=6,five=()=>ec()>=9,rapid=()=>ec()>=11;
const damageLimit=()=>rapidCount>=500?100:rapidCount>=400?50:rapidCount>=300?25:rapidCount>=200?10:rapidCount>=100?5:1;
const speedLimit=()=>rapidCount>=500?30:rapidCount>=400?25:rapidCount>=300?20:rapidCount>=200?15:rapidCount>=100?12:10;
function stopGame(){if(raf)cancelAnimationFrame(raf);raf=0;G=null;keys={left:false,right:false,shoot:false};stopBgm()}
function go(s){stopGame();scene=s;render()}
function end(id){unlock(id);save();go("ending")}
function back(to="main"){return `<button class="btn back" data-go="${to}">戻る</button>`}
function bind(){app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
function render(){
 app.innerHTML="";
 if(scene==="main")main();else if(scene==="rapid")rapidScene();else if(scene==="ending")ending();else if(scene==="collection")collection();
 else if(scene==="shootMenu")shootMenu();else if(scene==="custom")custom();else if(scene==="shooting")startGame(false,false,0);
 else if(scene==="bossChoice")bossChoice();else if(scene==="bossDef")bossDef();else if(scene==="invUnlock")invUnlock();else if(scene==="rushClear")rushClear();
 bind();
}
function main(){started=Date.now();outside=0;app.innerHTML=`<button class="btn darkred" id="rapid">連打モード</button><h1 class="title">押すな。</h1><p class="sub" id="msg">本当に、押さないでください。</p><button class="big-red" id="red"></button><p class="counter">END ${ec()} / 11</p><div class="bottom"><button class="btn" data-go="collection">END図鑑</button><button class="btn" data-go="shootMenu">SHOOTING</button></div>`;
 app.querySelector("#rapid").onclick=()=>{rapidCount=0;rapidNotice="";go("rapid")};
 app.querySelector("#red").onclick=()=>{SE.button();let e=(Date.now()-started)/1000;end(e<1.5?"END01":e<15?"END02":"END03")};
 app.onclick=e=>{if(scene!=="main")return;if(e.target.closest("button"))return;outside++;if(outside>=8)end("END05");else{const msg=app.querySelector("#msg");if(msg)msg.textContent=`そこじゃない。 (${outside}/8)`}};
}
function rapidScene(){app.innerHTML=`${back()}<h2 class="title" style="font-size:34px">連打モード</h2><p class="sub">押した回数：<b id="rc">${rapidCount}</b> 回</p><button class="big-red" id="rr"></button><p class="notice" id="rn">${rapidNotice}</p>`;
 app.querySelector("#rr").onclick=()=>{rapidCount++;S.rapidBest=Math.max(S.rapidBest,rapidCount);
 if(rapidCount===15){unlock("END04");rapidNotice=(newEnd?"NEW END！ ":"")+"END04「連打魔」"}
 if(rapidCount===100){unlock("END11");rapidNotice=(newEnd?"NEW END！ ":"")+"END11「もういいって。」 [ダメージ上限5 / 速度12]"}
 if(rapidCount===200){S.invUnlock=true;rapidNotice="200回達成！ 無敵解放！ ダメージ上限10 / 速度15"}
 if(rapidCount===300){S.cheatUnlock=true;rapidNotice="300回達成！ CHEAT解放！ ダメージ上限25 / 速度20"}
 if(rapidCount===400){S.wingUnlock=true;rapidNotice="400回達成！ 僚機解放！ ダメージ上限50 / 速度25"}
 if(rapidCount===500){S.punchUnlock=true;rapidNotice="500回達成！ ONE PUNCH解放！ ダメージ上限100 / 速度30"}
 save();app.querySelector("#rc").textContent=rapidCount;app.querySelector("#rn").textContent=rapidNotice};
}
function ending(){let sub=currentEnd==="END11"?"もう押さなくていいです。":currentEnd==="END09"?"だから撃つなって言ったのに。":currentEnd==="END10"?"今回は言うことを聞いたんですね。":currentEnd==="END08"?"ずいぶん楽しんでますね。":currentEnd==="END07"?"武器は飾りですか？":currentEnd==="END06"?"戦わないという選択。":"押すなって言ったのに。";
 app.innerHTML=`<section class="ending">${newEnd?'<p style="color:#46be6e">NEW END</p>':""}<h2>${currentEnd}</h2><div class="name">${ENDINGS[currentEnd]}</div><p class="sub">${sub}</p><br><button class="btn red" data-go="main">もう一度</button> <button class="btn" data-go="collection">END図鑑</button></section>`}
function collection(){app.innerHTML=`${back()}<section class="collection"><h2 class="center">END図鑑</h2>${Object.entries(ENDINGS).map(([id,n])=>`<div class="endrow">${S.ends.includes(id)?`${id}　${n}`:"????　？？？？？"}</div>`).join("")}</section>`}
function shootMenu(){app.innerHTML=`${back()}<section class="panel"><h2 class="center">SHOOTING</h2><button class="btn blue" data-go="custom">機体カスタム</button>${S.invUnlock?'<button class="btn purple" id="rush">BOSS RUSH</button>':""}<button class="btn red" id="start">START</button><button class="btn ${S.shooting?"green":"red"}" id="toggle">SHOOTING：${S.shooting?"ON":"OFF"}</button></section>`;
 app.querySelector("#start").onclick=()=>{if(S.shooting)go("shooting")};
 if(S.invUnlock)app.querySelector("#rush").onclick=()=>{bossRush=true;startGame(true,true,1)};
 app.querySelector("#toggle").onclick=()=>{S.shooting=!S.shooting;save();if(!S.shooting)end("END06");else render()};
}
function custom(){let a=[`<button class="btn custom-item ${S.weapon==="single"?"green":""}" data-w="single">単発ショット</button>`];
 if(dual())a.push(`<button class="btn custom-item ${S.weapon==="dual"?"green":""}" data-w="dual">2連装</button>`);
 if(spread())a.push(`<button class="btn custom-item ${S.weapon==="spread"?"green":""}" data-w="spread">3方向ショット</button>`);
 if(five())a.push(`<button class="btn custom-item ${S.weapon==="fiveway"?"green":""}" data-w="fiveway">5方向ショット</button>`);
 if(shield())a.push(`<button class="btn custom-item ${S.shield?"green":""}" data-t="shield">シールド ${S.shield?"ON":"OFF"}</button>`);
 if(rapid())a.push(`<button class="btn custom-item ${S.rapid?"green":""}" data-t="rapid">連射強化 ${S.rapid?"ON":"OFF"}</button>`);
 if(S.invUnlock)a.push(`<button class="btn custom-item ${S.inv?"green":""}" data-t="inv">無敵 ${S.inv?"ON":"OFF"}</button>`);
 if(S.cheatUnlock)a.push(`<button class="btn custom-item ${S.cheat?"green":""}" data-t="cheat">CHEAT MODE ${S.cheat?"ON":"OFF"}</button>`);
 if(S.wingUnlock)a.push(`<button class="btn custom-item ${S.wing?"green":""}" data-t="wing">僚機 ×2 ${S.wing?"ON":"OFF"}</button>`);
 if(S.punchUnlock)a.push(`<button class="btn custom-item ${S.punch?"green":""}" data-t="punch">ONE PUNCH ${S.punch?"ON":"OFF"}</button>`);
 if(rapidCount>=100)a.push(`<div class="stat"><button class="btn" data-stat="damage" data-d="-1">−</button><div class="center">弾ダメージ：${S.damage} / 上限 ${damageLimit()}</div><button class="btn" data-stat="damage" data-d="1">＋</button></div><div class="stat"><button class="btn" data-stat="speed" data-d="-1">−</button><div class="center">弾速度：${S.speed} / 上限 ${speedLimit()}</div><button class="btn" data-stat="speed" data-d="1">＋</button></div>`);
 app.innerHTML=`${back("shootMenu")}<h2 class="custom-title">機体カスタム<br><span class="muted">発見END：${ec()} / 11</span></h2><div class="scroll">${a.join("")}</div>`;
 app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.weapon=b.dataset.w;save();render()});
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S[b.dataset.t]=!S[b.dataset.t];save();render()});
 app.querySelectorAll("[data-stat]").forEach(b=>b.onclick=()=>{let d=+b.dataset.d;if(b.dataset.stat==="damage")S.damage=Math.max(1,Math.min(damageLimit(),S.damage+d));else S.speed=Math.max(2,Math.min(speedLimit(),S.speed+d));save();render()});
}
function freshGame(boss,rush,no){let hp=3+(S.shield&&shield()?1:0);return {boss,rush,no,hp,score:0,shots:0,x:50,bullets:[],enemies:[],enemyBullets:[],lastShot:0,lastEnemy:0,lastBossShot:0,prev:performance.now(),bossHp:boss?(rush?RUSH_HP[no]:BOSS_HP[no]):0,bossMax:boss?(rush?RUSH_HP[no]:BOSS_HP[no]):0,bossX:50,bossDir:1,phase:1,special:false,specialDone:false,specialAt:0}}
function startGame(boss,rush,no){stopGame();scene=boss?"boss":"shooting";bossRush=rush;lastBossNo=no||1;G=freshGame(boss,rush,no||1);gameShell();if(boss){SE.bossIn();bossBgm(rush)}raf=requestAnimationFrame(loop)}
function gameShell(){app.innerHTML=`<div class="gamewrap"><div class="hud"><span id="score">${G.boss?"DMG 0":"SCORE 0"}</span><span id="stage">${G.boss?(G.rush?"RUSH ":"BOSS ")+G.no:"HP "+G.hp}</span><span id="hp">${G.boss?"HP "+G.bossHp:""}</span></div>${G.boss?'<div class="hpbar"><i id="bar" style="width:100%"></i></div>':""}<div class="arena" id="arena"></div><div class="controls"><div class="move-pad"><div class="joystick" id="joy"><div class="joystick-knob" id="knob"></div></div></div><button class="btn shoot" id="fire">撃つ</button></div><p class="notice" id="notice"></p><button class="btn" id="quit" style="width:100%">やめる</button></div>`;
 let joy=app.querySelector("#joy"),knob=app.querySelector("#knob"),active=false;
 const reset=()=>{active=false;keys.left=keys.right=false;knob.style.transform="translate(-50%,-50%)"};
 const move=e=>{if(!active)return;e.preventDefault();let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),lim=r.width*.30;dx=Math.max(-lim,Math.min(lim,dx));knob.style.transform=`translate(calc(-50% + ${dx}px),-50%)`;keys.left=dx<-8;keys.right=dx>8};
 joy.addEventListener("pointerdown",e=>{active=true;joy.setPointerCapture?.(e.pointerId);move(e)});joy.addEventListener("pointermove",move);joy.addEventListener("pointerup",reset);joy.addEventListener("pointercancel",reset);
 let f=app.querySelector("#fire");f.addEventListener("pointerdown",e=>{e.preventDefault();keys.shoot=true});["pointerup","pointercancel","pointerleave"].forEach(n=>f.addEventListener(n,e=>{e.preventDefault();keys.shoot=false}));
 app.querySelector("#quit").onclick=()=>go("shootMenu");
 drawArena();
}
function fire(){if(!G)return;let now=performance.now(),delay=(S.cheat&&S.cheatUnlock)?20:(S.rapid&&rapid()?80:180);if(now-G.lastShot<delay)return;G.lastShot=now;G.shots++;SE.shot();
 let ds=S.weapon==="fiveway"?[-4,-2,0,2,4]:S.weapon==="spread"?[-2,0,2]:S.weapon==="dual"?[0,0]:[0];
 let origins=S.weapon==="dual"?[G.x-1.4,G.x+1.4]:[G.x];if(S.wing&&S.wingUnlock)origins.push(Math.max(3,G.x-6),Math.min(97,G.x+6));
 origins.forEach(x=>ds.forEach((dx,i)=>{if(S.weapon==="dual"&&i>0)return;G.bullets.push({x,y:84,dx})}));
}
function hitPlayer(){if((S.inv&&S.invUnlock)||(S.cheat&&S.cheatUnlock))return;SE.hurt();G.hp--;if(G.hp<=0){if(!G.boss&&G.shots===0)end("END07");else go("main")}}
function loop(now){if(!G)return;let dt=Math.min(.04,(now-G.prev)/1000);G.prev=now;if(keys.left)G.x=Math.max(4,G.x-45*dt);if(keys.right)G.x=Math.min(96,G.x+45*dt);if(keys.shoot)fire();
 G.bullets.forEach(b=>{b.y-=S.speed*5*dt;b.x+=b.dx*10*dt});G.bullets=G.bullets.filter(b=>b.y>-5&&b.x>-5&&b.x<105);
 if(G.boss)updateBoss(now,dt);else updateNormal(now,dt);
 if(!G)return;drawArena();raf=requestAnimationFrame(loop);
}
function updateNormal(now,dt){if(now-G.lastEnemy>=650){G.lastEnemy=now;G.enemies.push({x:5+Math.random()*90,y:-4,speed:12+Math.random()*12})}
 G.enemies.forEach(e=>e.y+=e.speed*dt);
 for(let i=G.enemies.length-1;i>=0;i--){let e=G.enemies[i],hit=G.bullets.findIndex(b=>Math.abs(b.x-e.x)<4&&Math.abs(b.y-e.y)<5);if(hit>=0){G.bullets.splice(hit,1);G.enemies.splice(i,1);G.score++;SE.enemyDown();if(G.score>=20){unlock("END08");save();stopGame();scene="bossChoice";render();return}continue}if(e.y>105){G.enemies.splice(i,1);hitPlayer();if(!G)return}}
}
function updateBoss(now,dt){
 if(!G.special){G.bossX+=G.bossDir*12*dt;if(G.bossX<=12){G.bossX=12;G.bossDir=1}if(G.bossX>=88){G.bossX=88;G.bossDir=-1}}
 for(let i=G.bullets.length-1;i>=0;i--){let b=G.bullets[i];if(Math.abs(b.x-G.bossX)<10&&Math.abs(b.y-18)<8){G.bullets.splice(i,1);if(G.special){end("END09");return}let d=(S.punch&&S.punchUnlock)?G.bossHp:S.damage*((S.cheat&&S.cheatUnlock)?100:1);G.bossHp=Math.max(0,G.bossHp-d);SE.hit()}}
 if(!G)return;
 let ratio=G.bossHp/Math.max(1,G.bossMax);G.phase=ratio<=.25?3:ratio<=.5?2:1;
 if(!G.rush&&G.no===1&&!(S.punch&&S.punchUnlock)&&G.bossHp<=50&&!G.special&&!G.specialDone){G.bossHp=50;G.special=true;G.specialAt=now;G.bullets=[];G.enemyBullets=[]}
 if(G.special){G.bossHp=50;G.enemyBullets=[];if(now-G.specialAt>=10000){unlock("END10");save();G.special=false;G.specialDone=true;G.bullets=[]}return}
 if(G.bossHp<=0&&(G.no>=2||G.specialDone||G.rush||(S.punch&&S.punchUnlock))){lastBossNo=G.no;bossRush=G.rush;SE.bossDown();stopGame();scene="bossDef";render();return}
 let delay=G.phase===1?1000:G.phase===2?650:400;
 if(now-G.lastBossShot>=delay){G.lastBossShot=now;let dy=18+G.phase*4;G.enemyBullets.push({x:G.bossX,y:25,dx:0,dy});if(G.no>=2)G.enemyBullets.push({x:G.bossX,y:25,dx:12,dy});if(G.no>=3)G.enemyBullets.push({x:G.bossX,y:25,dx:-12,dy});if(G.no>=4){G.enemyBullets.push({x:G.bossX,y:25,dx:-24,dy});G.enemyBullets.push({x:G.bossX,y:25,dx:24,dy})}if(G.no>=5)G.enemyBullets.push({x:G.bossX,y:25,dx:(G.x-G.bossX)*.35,dy:32})}
 G.enemyBullets.forEach(b=>{b.x+=b.dx*dt;b.y+=b.dy*dt});for(let i=G.enemyBullets.length-1;i>=0;i--){let b=G.enemyBullets[i];if(Math.abs(b.x-G.x)<4&&Math.abs(b.y-88)<6){G.enemyBullets.splice(i,1);hitPlayer();if(!G)return}else if(b.y>106||b.x<-5||b.x>105)G.enemyBullets.splice(i,1)}
}
function drawArena(){if(!G)return;let a=app.querySelector("#arena");if(!a)return;let z=[];if(G.boss)z.push(`<div class="boss" style="left:${G.bossX}%;top:18%"></div>`);G.enemies.forEach(e=>z.push(`<div class="enemy" style="left:${e.x}%;top:${e.y}%"></div>`));G.bullets.forEach(b=>z.push(`<div class="bullet" style="left:${b.x}%;top:${b.y}%"></div>`));G.enemyBullets.forEach(b=>z.push(`<div class="ebullet" style="left:${b.x}%;top:${b.y}%"></div>`));if(G.special)z.push(`<div class="special" style="left:${G.bossX}%;top:30%">撃つな。</div>`);if(S.wing&&S.wingUnlock)z.push(`<div class="wing" style="left:${Math.max(4,G.x-6)}%;top:89%"></div><div class="wing" style="left:${Math.min(96,G.x+6)}%;top:89%"></div>`);z.push(`<div class="ship" style="left:${G.x}%;top:89%"></div>`);a.innerHTML=z.join("");
 app.querySelector("#score").textContent=G.boss?`DMG ${G.bossMax-G.bossHp}`:`SCORE ${G.score}`;app.querySelector("#stage").textContent=G.boss?(G.rush?"RUSH ":"BOSS ")+G.no:`HP ${G.hp}`;if(G.boss){app.querySelector("#hp").textContent=`HP ${G.bossHp}`;app.querySelector("#bar").style.width=(100*G.bossHp/G.bossMax)+"%"}}
function bossChoice(){app.innerHTML=`<section class="modal"><h2>END08「破壊者」</h2>${newEnd?'<p style="color:#46be6e;margin:12px">NEW END</p>':""}<p class="sub">ずいぶん楽しんでますね。<br><br>ボスに挑戦しますか？</p><button class="btn red" id="yes">挑戦する</button><button class="btn" id="no">やめる</button></section>`;
 app.querySelector("#yes").onclick=()=>startGame(true,false,1);app.querySelector("#no").onclick=()=>go("main")}
function bossDef(){app.innerHTML=`<section class="modal"><h2>${bossRush?"RUSH ":""}BOSS ${lastBossNo} DEFEATED</h2><p class="sub">次に進みますか？</p><button class="btn" id="stop">やめる</button><button class="btn red" id="next">次へ</button></section>`;
 app.querySelector("#stop").onclick=()=>go("main");app.querySelector("#next").onclick=()=>{if(bossRush){if(lastBossNo>=15){scene="rushClear";render()}else startGame(true,true,lastBossNo+1)}else{if(lastBossNo>=5){S.invUnlock=true;save();scene="invUnlock";render()}else startGame(true,false,lastBossNo+1)}}}
function invUnlock(){app.innerHTML=`<section class="modal"><h2>無敵モード解放！</h2><p class="sub">機体カスタムからON/OFFできます。</p><button class="btn blue" data-go="shootMenu">メニューへ</button></section>`}
function rushClear(){app.innerHTML=`<section class="modal"><h2>BOSS RUSH CLEAR</h2><p class="sub">15体のボスを撃破！</p><button class="btn purple" data-go="shootMenu">メニューへ</button></section>`}
render();
})();
</script></body></html>
