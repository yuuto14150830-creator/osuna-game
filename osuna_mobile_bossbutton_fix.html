<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<title>押すな。 MOBILE</title>
<style>
:root{color-scheme:dark;--bg:#0f0f12;--panel:#1b1b21;--muted:#919196;--red:#dc232d;--darkred:#8c1419;--green:#46be6e;--blue:#4696ff;--purple:#b964ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#08090e;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;min-height:100%;touch-action:manipulation}
#app{width:min(100%,760px);min-height:100vh;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));position:relative;overflow:hidden}
h1,h2,p{margin:0}.title{text-align:center;font-size:clamp(34px,10vw,64px);margin-top:42px}.sub{text-align:center;color:var(--muted);margin-top:18px;min-height:24px}
.btn{border:0;border-radius:12px;background:#37373e;color:white;font-weight:700;font-size:16px;min-height:48px;padding:10px 16px;touch-action:manipulation}.btn:active{transform:scale(.97)}.red{background:var(--red)}.green{background:var(--green)}.blue{background:var(--blue)}.purple{background:var(--purple)}.darkred{background:var(--darkred)}
.back{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));z-index:5}.row{display:flex;gap:10px}.row>*{flex:1}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:32px}.bottom .btn{flex:1}
.big-red{display:block;width:190px;height:190px;border-radius:50%;border:0;background:var(--red);box-shadow:0 12px 0 var(--darkred);margin:90px auto 0}.big-red:active{transform:translateY(6px);box-shadow:0 6px 0 var(--darkred)}
.counter{text-align:center;margin-top:34px;color:var(--muted)}.center{text-align:center}.panel{margin:105px auto 0;max-width:520px}.panel .btn{width:100%;margin:7px 0}.scroll{height:calc(100vh - 125px);overflow-y:auto;padding:100px 6px 100px;-webkit-overflow-scrolling:touch}.custom-title{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none}.custom-item{width:100%;margin:6px 0}.stat{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;margin:12px 0}.stat .btn{padding:0}.muted{color:var(--muted);font-size:14px}.ending{padding-top:130px;text-align:center}.ending h2{font-size:34px}.ending .name{font-size:24px;margin:24px 0}.collection{padding:90px 0 30px}.endrow{padding:12px;border-bottom:1px solid #333}.gamewrap{padding-top:48px}.hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}.arena{width:100%;aspect-ratio:4/3;background:#070912;border:1px solid #282b3a;border-radius:10px;position:relative;overflow:hidden;touch-action:none}.ship{position:absolute;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:38px solid #4696ff;transform:translate(-50%,-50%)}.wing{position:absolute;width:16px;height:24px;background:#50dcd2;clip-path:polygon(50% 0,0 100%,50% 72%,100% 100%);transform:translate(-50%,-50%)}.enemy{position:absolute;width:30px;height:30px;border-radius:50%;background:#dc232d;transform:translate(-50%,-50%)}.boss{position:absolute;width:90px;height:48px;border-radius:14px;background:#b964ff;transform:translate(-50%,-50%)}.bullet,.ebullet{position:absolute;width:6px;height:14px;border-radius:4px;background:#ffe050;transform:translate(-50%,-50%)}.ebullet{background:#ff5555;width:9px;height:16px}.special{position:absolute;color:#ff4545;font-weight:900;font-size:26px;transform:translate(-50%,-50%);white-space:nowrap}.controls{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:12px;align-items:center}.move-pad{display:flex;align-items:center;justify-content:center;min-height:120px}.joystick{width:112px;height:112px;border-radius:50%;background:#242936;border:3px solid #4a5265;position:relative;touch-action:none;user-select:none;box-shadow:inset 0 0 0 2px #151821}.joystick-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#69748d;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 3px 8px #0008}.shoot{background:var(--red);font-size:22px!important;font-weight:900;border-radius:50%!important;width:108px;height:108px;min-height:108px!important;justify-self:center;user-select:none;touch-action:none}.controls .btn{font-size:22px;user-select:none;touch-action:none}.notice{text-align:center;color:#ffe050;min-height:22px;margin-top:12px}.hpbar{height:10px;background:#333;border-radius:8px;overflow:hidden;margin-bottom:8px}.hpbar>i{display:block;height:100%;background:#dc232d}.modal{padding-top:130px;text-align:center}.modal .btn{margin:8px;min-width:150px}@media(max-width:430px){#app{padding-left:10px;padding-right:10px}.big-red{width:170px;height:170px;margin-top:80px}.title{margin-top:54px}.controls .btn{min-height:58px}.hud{font-size:13px}}
</style>
</head>
<body><main id="app"></main>
<script>
(()=>{"use strict";
const ENDINGS={END01:"反射神経",END02:"我慢できない",END03:"疑心暗鬼",END04:"連打魔",END05:"押してない",END06:"平和主義者",END07:"臆病者",END08:"破壊者",END09:"言うこと聞けないの？",END10:"従順",END11:"もういいって。"};
const BOSS_HP=[0,300,1500,10000,100000,1000000],RUSH_HP=[0,10000,25000,50000,100000,250000,500000,1000000,5000000,10000000,50000000,100000000,1000000000,10000000000,100000000000,1000000000000];
const def={ends:[],rapidBest:0,weapon:"single",shield:false,rapid:false,invUnlock:false,inv:false,cheatUnlock:false,cheat:false,wingUnlock:false,wing:false,punchUnlock:false,punch:false,damage:1,speed:10};
let S;try{S={...def,...JSON.parse(localStorage.getItem("osunaMobile")||"{}")}}catch{S={...def}};const save=()=>localStorage.setItem("osunaMobile",JSON.stringify(S));
const app=document.querySelector("#app");let scene="main",started=Date.now(),outside=0,currentEnd="",rapidCount=0,notice="",raf=0,G=null,keys={left:false,right:false,shoot:false};
const ec=()=>S.ends.length, unlock=id=>{currentEnd=id;if(!S.ends.includes(id)){S.ends.push(id);save();return true}return false};
const damageLimit=()=>S.rapidBest>=500?100:S.rapidBest>=400?50:S.rapidBest>=300?25:S.rapidBest>=200?10:S.rapidBest>=100?5:1;
const speedLimit=()=>S.rapidBest>=500?30:S.rapidBest>=400?25:S.rapidBest>=300?20:S.rapidBest>=200?15:S.rapidBest>=100?12:10;
const dual=()=>ec()>=3, spread=()=>ec()>=6, shield=()=>ec()>=6, five=()=>ec()>=9, rapid=()=>ec()>=11;
function stopGame(){cancelAnimationFrame(raf);raf=0;G=null;keys={left:false,right:false,shoot:false}}
function go(s){stopGame();scene=s;render()}
function backBtn(to="main"){return `<button class="btn back" data-go="${to}">戻る</button>`}
function bindCommon(){app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
function end(id){unlock(id);save();go("ending")}
function render(){
 app.innerHTML="";
 if(scene==="main") renderMain(); else if(scene==="rapid") renderRapid(); else if(scene==="ending") renderEnding(); else if(scene==="collection") renderCollection();
 else if(scene==="shootMenu") renderShootMenu(); else if(scene==="custom") renderCustom(); else if(scene==="shooting") startGame(false,false);
 else if(scene==="bossChoice") renderBossChoice(); else if(scene==="boss") startGame(true,false,lastBossNo); else if(scene==="rush") startGame(true,true,1); else if(scene==="bossDef") renderBossDef();
 else if(scene==="rushClear") renderRushClear(); else if(scene==="invUnlock") renderInvUnlock();
 bindCommon();
}
function renderMain(){started=Date.now();outside=0;app.innerHTML=`<button class="btn darkred" id="rapid">連打モード</button><h1 class="title">押すな。</h1><p class="sub" id="msg">本当に、押さないでください。</p><button class="big-red" id="red" aria-label="押すなボタン"></button><p class="counter">END ${ec()} / 11</p><div class="bottom"><button class="btn" data-go="collection">END図鑑</button><button class="btn" data-go="shootMenu">SHOOTING</button></div>`;
 app.querySelector("#rapid").onclick=()=>{rapidCount=0;notice="";go("rapid")};
 app.querySelector("#red").onclick=()=>{let e=(Date.now()-started)/1000;end(e<1.5?"END01":e<15?"END02":"END03")};
 app.onclick=e=>{if(e.target.closest("button"))return;outside++;if(outside>=8)end("END05");else app.querySelector("#msg").textContent=`そこじゃない。 (${outside}/8)`};
}
function renderRapid(){app.innerHTML=`${backBtn()}<h2 class="title" style="font-size:34px">連打モード</h2><p class="sub">押した回数：<b id="rc">${rapidCount}</b> 回</p><button class="big-red" id="rr"></button><p class="notice" id="notice">${notice}</p>`;
 app.querySelector("#rr").onclick=()=>{rapidCount++;S.rapidBest=Math.max(S.rapidBest,rapidCount);let n="";
 if(rapidCount===15){unlock("END04");n="END04「連打魔」"}
 if(rapidCount===100){unlock("END11");n="100回！ 弾性能調整を解放"}
 if(rapidCount===200){S.invUnlock=true;n="200回！ 無敵を解放"}
 if(rapidCount===300){S.cheatUnlock=true;n="300回！ CHEAT MODEを解放"}
 if(rapidCount===400){S.wingUnlock=true;n="400回！ 僚機 ×2 を解放"}
 if(rapidCount===500){S.punchUnlock=true;n="500回！ ONE PUNCHを解放"}
 if(n)notice=n;save();app.querySelector("#rc").textContent=rapidCount;app.querySelector("#notice").textContent=notice};
}
function renderEnding(){let name=ENDINGS[currentEnd]||"END";app.innerHTML=`<section class="ending"><p class="muted">ENDING</p><h2>${currentEnd}</h2><div class="name">${name}</div><button class="btn red" data-go="main">もう一度</button> <button class="btn" data-go="collection">END図鑑</button></section>`}
function renderCollection(){app.innerHTML=`${backBtn()}<section class="collection"><h2 class="center">END図鑑</h2>${Object.entries(ENDINGS).map(([id,n])=>`<div class="endrow">${S.ends.includes(id)?`${id}　${n}`:`????　？？？？？`}</div>`).join("")}</section>`}
function renderShootMenu(){app.innerHTML=`${backBtn()}<section class="panel"><h2 class="center">SHOOTING</h2><button class="btn blue" data-go="custom">機体カスタム</button>${S.invUnlock?`<button class="btn purple" data-go="rush">BOSS RUSH</button>`:""}<button class="btn red" id="start">START</button><button class="btn ${S.shooting?"green":"red"}" id="toggle">SHOOTING：${S.shooting===false?"OFF":"ON"}</button></section>`;
 app.querySelector("#start").onclick=()=>{if(S.shooting!==false)go("shooting")};app.querySelector("#toggle").onclick=()=>{S.shooting=S.shooting===false;save();if(!S.shooting)end("END06");else render()};
}
function renderCustom(){let items=[`<button class="btn custom-item ${S.weapon==="single"?"green":""}" data-w="single">単発ショット</button>`];
 if(dual())items.push(`<button class="btn custom-item ${S.weapon==="dual"?"green":""}" data-w="dual">2連装</button>`);
 if(spread())items.push(`<button class="btn custom-item ${S.weapon==="spread"?"green":""}" data-w="spread">3方向ショット</button>`);
 if(five())items.push(`<button class="btn custom-item ${S.weapon==="fiveway"?"green":""}" data-w="five">5方向ショット</button>`);
 if(shield())items.push(`<button class="btn custom-item ${S.shield?"green":""}" data-t="shield">シールド ${S.shield?"ON":"OFF"}</button>`);
 if(rapid())items.push(`<button class="btn custom-item ${S.rapid?"green":""}" data-t="rapid">連射強化 ${S.rapid?"ON":"OFF"}</button>`);
 if(S.invUnlock)items.push(`<button class="btn custom-item ${S.inv?"green":""}" data-t="inv">無敵 ${S.inv?"ON":"OFF"}</button>`);
 if(S.cheatUnlock)items.push(`<button class="btn custom-item ${S.cheat?"green":""}" data-t="cheat">CHEAT MODE ${S.cheat?"ON":"OFF"}</button>`);
 if(S.wingUnlock)items.push(`<button class="btn custom-item ${S.wing?"green":""}" data-t="wing">僚機 ×2 ${S.wing?"ON":"OFF"}</button>`);
 if(S.punchUnlock)items.push(`<button class="btn custom-item ${S.punch?"green":""}" data-t="punch">ONE PUNCH ${S.punch?"ON":"OFF"}</button>`);
 if(S.rapidBest>=100)items.push(`<div class="stat"><button class="btn" data-stat="damage" data-d="-1">−</button><div class="center">弾ダメージ：${S.damage}<br><span class="muted">上限 ${damageLimit()}</span></div><button class="btn" data-stat="damage" data-d="1">＋</button></div><div class="stat"><button class="btn" data-stat="speed" data-d="-1">−</button><div class="center">弾速度：${S.speed}<br><span class="muted">上限 ${speedLimit()}</span></div><button class="btn" data-stat="speed" data-d="1">＋</button></div>`);
 app.innerHTML=`${backBtn("shootMenu")}<h2 class="custom-title">機体カスタム<br><span class="muted">発見END：${ec()} / 11</span></h2><div class="scroll">${items.join("")}</div>`;
 app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.weapon=b.dataset.w;save();render()});app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S[b.dataset.t]=!S[b.dataset.t];save();render()});
 app.querySelectorAll("[data-stat]").forEach(b=>b.onclick=()=>{let d=+b.dataset.d;if(b.dataset.stat==="damage")S.damage=Math.max(1,Math.min(damageLimit(),S.damage+d));else S.speed=Math.max(2,Math.min(speedLimit(),S.speed+d));save();render()});
}
function newGame(boss,rush,bossNo=1){return {boss,rush,bossNo,hp:3+(S.shield&&shield()?1:0),score:0,shots:0,x:50,bullets:[],enemies:[],enemyBullets:[],lastShot:0,lastEnemy:0,lastBoss:0,start:performance.now(),special:false,specialAt:0,specialDone:false,bossHp:boss?(rush?RUSH_HP[bossNo]:BOSS_HP[bossNo]):0,bossMax:boss?(rush?RUSH_HP[bossNo]:BOSS_HP[bossNo]):0,bossX:50,bossDir:1}}
function startGame(boss,rush,bossNo=1){G=newGame(boss,rush,bossNo);drawGameShell();raf=requestAnimationFrame(loop)}
function drawGameShell(){app.innerHTML=`<div class="gamewrap"><div class="hud"><span id="score">SCORE 0</span><span id="stage">${G.boss?(G.rush?"RUSH ":"BOSS ")+G.bossNo:"HP "+G.hp}</span><span id="hp">${G.boss?"HP "+G.bossHp:""}</span></div>${G.boss?`<div class="hpbar"><i id="bar" style="width:100%"></i></div>`:""}<div class="arena" id="arena"></div><div class="controls"><div class="move-pad"><div class="joystick" id="joystick"><div class="joystick-knob" id="joystickKnob"></div></div></div><button class="btn shoot" id="fire">撃つ</button></div><p class="notice" id="gn"></p><button class="btn" id="quit" style="width:100%;margin-top:10px">やめる</button></div>`;
 {let joy=app.querySelector("#joystick"),knob=app.querySelector("#joystickKnob"),active=false;
 const reset=()=>{active=false;keys.left=false;keys.right=false;knob.style.transform="translate(-50%,-50%)"};
 const move=e=>{if(!active)return;e.preventDefault();let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),lim=r.width*.30;dx=Math.max(-lim,Math.min(lim,dx));knob.style.transform=`translate(calc(-50% + ${dx}px),-50%)`;keys.left=dx<-8;keys.right=dx>8};
 joy.addEventListener("pointerdown",e=>{active=true;joy.setPointerCapture?.(e.pointerId);move(e)});joy.addEventListener("pointermove",move);joy.addEventListener("pointerup",reset);joy.addEventListener("pointercancel",reset);
 let b=app.querySelector("#fire"),on=e=>{e.preventDefault();keys.shoot=true},off=e=>{e.preventDefault();keys.shoot=false};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);}
 app.querySelector("#quit").onclick=()=>go("shootMenu");
}
function fire(){let now=performance.now(),delay=S.cheat&&S.cheatUnlock?20:(S.rapid&&rapid()?80:180);if(now-G.lastShot<delay)return;G.lastShot=now;G.shots++;let ds=S.weapon==="five"?[-4,-2,0,2,4]:S.weapon==="spread"?[-2,0,2]:S.weapon==="dual"?[-.7,.7]:[0];let origins=[G.x];if(S.wing&&S.wingUnlock)origins.push(Math.max(4,G.x-8),Math.min(96,G.x+8));origins.forEach(x=>ds.forEach(dx=>G.bullets.push({x,y:84,dx})))}
function hitPlayer(){if((S.inv&&S.invUnlock)||(S.cheat&&S.cheatUnlock))return;G.hp--;if(G.hp<=0){if(G.shots===0)end("END07");else go("main")}}
function loop(now){if(!G)return;let dt=Math.min(.035,(now-(G.prev||now))/1000);G.prev=now;if(keys.left)G.x=Math.max(4,G.x-45*dt);if(keys.right)G.x=Math.min(96,G.x+45*dt);if(keys.shoot)fire();
 G.bullets.forEach(b=>{b.y-=S.speed*5*dt;b.x+=b.dx*10*dt});G.bullets=G.bullets.filter(b=>b.y>-4&&b.x>-5&&b.x<105);
 if(G.boss)updateBoss(now,dt);else updateNormal(now,dt);drawArena();if(G)raf=requestAnimationFrame(loop)}
function updateNormal(now,dt){if(now-G.lastEnemy>650){G.lastEnemy=now;G.enemies.push({x:8+Math.random()*84,y:-3})}G.enemies.forEach(e=>e.y+=18*dt);
 for(let i=G.enemies.length-1;i>=0;i--){let e=G.enemies[i],hit=G.bullets.findIndex(b=>Math.hypot(b.x-e.x,b.y-e.y)<4);if(hit>=0){G.bullets.splice(hit,1);G.enemies.splice(i,1);G.score++;continue}if(e.y>104){G.enemies.splice(i,1);hitPlayer()}}
 if(G.score>=20){unlock("END08");save();go("bossChoice");return}
}
function updateBoss(now,dt){G.bossX+=G.bossDir*(10+G.bossNo*1.3)*dt;if(G.bossX<12||G.bossX>88)G.bossDir*=-1;
 if(!G.rush&&!G.specialDone&&!G.special&&G.bossHp<=50&&!(S.punch&&S.punchUnlock)){G.bossHp=50;G.special=true;G.specialAt=now;G.bullets=[]}
 if(G.special){let hit=G.bullets.findIndex(b=>Math.abs(b.x-G.bossX)<8&&Math.abs(b.y-14)<7);if(hit>=0){G.bullets.splice(hit,1);end("END09");return}if(now-G.specialAt>=10000){G.special=false;G.specialDone=true;unlock("END10")}return}
 let interval=Math.max(220,950-G.bossNo*55);if(now-G.lastBoss>interval){G.lastBoss=now;let aimed=G.bossNo>=5?(G.x-G.bossX)/35:0;G.enemyBullets.push({x:G.bossX,y:16,dx:aimed+(G.bossNo>=4?(Math.random()<.5?-1.6:1.6):0)})}
 G.enemyBullets.forEach(b=>{b.y+=(20+G.bossNo*1.5)*dt;b.x+=b.dx*10*dt});for(let i=G.enemyBullets.length-1;i>=0;i--){let b=G.enemyBullets[i];if(Math.hypot(b.x-G.x,b.y-88)<5){G.enemyBullets.splice(i,1);hitPlayer()}else if(b.y>105)G.enemyBullets.splice(i,1)}
 for(let i=G.bullets.length-1;i>=0;i--){let b=G.bullets[i];if(Math.abs(b.x-G.bossX)<8&&Math.abs(b.y-14)<7){G.bullets.splice(i,1);if(G.special){end("END09");return}let d=S.punch&&S.punchUnlock?G.bossHp:S.damage*(S.cheat&&S.cheatUnlock?100:1);G.bossHp=Math.max(0,G.bossHp-d)}}
 if(G.bossHp<=0){if(G.rush){if(G.bossNo>=15){go("rushClear");return}G.bossNo++;G.bossMax=G.bossHp=RUSH_HP[G.bossNo];G.bullets=[];G.enemyBullets=[]}else if(G.specialDone||(S.punch&&S.punchUnlock)){lastBossNo=G.bossNo;go("bossDef");return}}
}
function drawArena(){if(!G)return;let a=app.querySelector("#arena");if(!a)return;let els=[];if(G.boss)els.push(`<div class="boss" style="left:${G.bossX}%;top:14%"></div>`);G.enemies.forEach(e=>els.push(`<div class="enemy" style="left:${e.x}%;top:${e.y}%"></div>`));G.bullets.forEach(b=>els.push(`<div class="bullet" style="left:${b.x}%;top:${b.y}%"></div>`));G.enemyBullets.forEach(b=>els.push(`<div class="ebullet" style="left:${b.x}%;top:${b.y}%"></div>`));if(G.special)els.push(`<div class="special" style="left:${G.boss?G.bossX:50}%;top:${G.boss?24:20}%">撃つな。</div>`);if(S.wing&&S.wingUnlock){els.push(`<div class="wing" style="left:${Math.max(4,G.x-8)}%;top:89%"></div><div class="wing" style="left:${Math.min(96,G.x+8)}%;top:89%"></div>`)}els.push(`<div class="ship" style="left:${G.x}%;top:89%"></div>`);a.innerHTML=els.join("");
 app.querySelector("#score").textContent=G.boss?`DMG ${G.bossMax-G.bossHp}`:`SCORE ${G.score}`;app.querySelector("#stage").textContent=G.boss?(G.rush?"RUSH ":"BOSS ")+G.bossNo:`HP ${G.hp}`;if(G.boss){app.querySelector("#hp").textContent=`HP ${G.bossHp}`;app.querySelector("#bar").style.width=(100*G.bossHp/G.bossMax)+"%"}}
function renderBossChoice(){app.innerHTML=`<section class="modal"><h2>END08「破壊者」</h2><p class="sub">敵の反応が消えた。<br><br>……まだ何かいるらしい。<br><br>ボスに挑戦しますか？</p><button class="btn red" id="challenge" type="button">挑戦する</button><button class="btn" id="leaveBoss" type="button">やめる</button></section>`;
 const challenge=app.querySelector("#challenge");
 const startBoss=e=>{e?.preventDefault?.();cancelAnimationFrame(raf);raf=0;keys={left:false,right:false,shoot:false};lastBossNo=1;scene="boss";G=newGame(true,false,1);drawGameShell();raf=requestAnimationFrame(loop)};
 challenge.addEventListener("click",startBoss);
 app.querySelector("#leaveBoss").addEventListener("click",e=>{e.preventDefault();go("main")});
}
